name: Test Competitive Exam AI

on:
  push:
    branches:
      - main
      - "upgrade/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run AI quality, provider fallback, and isolated smoke tests
        run: npm test
